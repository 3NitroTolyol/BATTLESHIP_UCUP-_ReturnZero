<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Морской Бой - Меню</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: white; padding-top: 50px; }
        .menu-box { background: #333; padding: 20px; border-radius: 10px; display: inline-block; width: 400px; }
        input, button { padding: 10px; font-size: 16px; margin: 10px; border-radius: 5px; border: none; width: 80%; }
        button { background: #0077be; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0099ff; }
        .room-list { margin-top: 20px; text-align: left; background: #444; padding: 10px; border-radius: 5px; }
        .room-item { border-bottom: 1px solid #666; padding: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="menu-box">
        <h1>⚓ BATTLESHIP ⚓</h1>
        <input type="text" id="nickname" placeholder="Ваш никнейм" value="Игрок">
        <input type="text" id="roomName" placeholder="Название комнаты" value="room1">
        <br>
        <button onclick="startGame('pvp')">Играть с другом (PvP)</button>
        <button style="background:#be0000" onclick="startGame('pve')">Играть с Ботом (PvE)</button>

        <div class="room-list">
            <strong>Активные комнаты:</strong>
            <div id="rooms-container">Загрузка...</div>
        </div>
    </div>

    <script>
        function startGame(mode) {
            const nickname = document.getElementById("nickname").value;
            const room = document.getElementById("roomName").value;
            window.location.href = `game.html?room=${room}&mode=${mode}&nickname=${nickname}`;
        }

        async function updateRooms() {
            try {
                const response = await fetch('/rooms');
                const rooms = await response.json();
                const container = document.getElementById("rooms-container");
                container.innerHTML = rooms.length === 0 ? "Нет активных комнат" : "";
                rooms.forEach(r => {
                    container.innerHTML += `<div class="room-item">
                        <span>${r.id} (${r.mode})</span>
                        <span style="color:${r.status === 'Занята' ? '#ff4444' : '#44ff44'}">${r.status}</span>
                    </div>`;
                });
            } catch (e) { console.error("Ошибка загрузки комнат"); }
        }

        setInterval(updateRooms, 3000); // Обновляем список каждые 3 сек
        updateRooms();
    </script>
</body>
</html>
