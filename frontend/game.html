<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Battleship.io - Бій</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --color-bg: #080808; --color-text: #ffffff; --color-text-hover: #00ff00; --font-main: 'Press Start 2P', cursive; }
        body { font-family: var(--font-main); text-align: center; background: var(--color-bg); color: white; margin: 0; padding: 20px; font-size: 10px; }
        
        .back-btn { position: absolute; top: 20px; left: 20px; font-size: 12px; color: #888; background: transparent; border: 2px solid #444; padding: 10px; cursor: pointer; z-index: 1000; font-family: inherit; }
        .back-btn:hover { color: #ff3333; border-color: #ff3333; }

        .board { display: grid; grid-template-columns: 30px repeat(10, 35px); grid-template-rows: 30px repeat(10, 35px); gap: 0; background: #111; padding: 5px; border: 3px solid #222; }
        .coord-label { display: flex; justify-content: center; align-items: center; color: #555; font-size: 10px; user-select: none; }
        .cell { width: 35px; height: 35px; background-image: url('/assets/Blank Square.png'); background-size: 100% 100%; position: relative; image-rendering: pixelated; cursor: pointer; transition: filter 0.1s; }
        
        .ship-one { background-image: url('/assets/ShipOne.png'), url('/assets/Blank Square.png') !important; background-size: 85% 85%, 100% 100% !important; background-position: center, center !important; background-repeat: no-repeat !important; }
        .ship-top { background-image: url('/assets/ShipTop.png'), url('/assets/Blank Square.png') !important; background-size: 85% 95%, 100% 100% !important; background-position: center bottom, center !important; background-repeat: no-repeat !important; }
        .ship-center { background-image: url('/assets/ShipCenter.png'), url('/assets/Blank Square.png') !important; background-size: 85% 100%, 100% 100% !important; background-position: center, center !important; background-repeat: no-repeat !important; }
        .ship-bottom { background-image: url('/assets/ShipBottom.png'), url('/assets/Blank Square.png') !important; background-size: 85% 95%, 100% 100% !important; background-position: center top, center !important; background-repeat: no-repeat !important; }
        
        .horizontal { transform: rotate(-90deg); }
        
        .cell.hit { background-color: #ee2222 !important; background-image: none !important; }
        .cell.hit::before { 
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: url('/assets/Square Shoot.png') !important; background-size: 100% 100% !important; 
            background-position: center !important; background-repeat: no-repeat !important;
            z-index: 100; display: block !important; transform: rotate(0deg) !important; 
        }
        .cell.miss::after { content: "•"; color: #666; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 24px; }
        
        .super-hover { background-color: rgba(255, 0, 255, 0.4) !important; box-shadow: inset 0 0 10px #ff00ff; z-index: 50;}
        
        .btn { padding: 15px; margin: 5px; cursor: pointer; font-family: inherit; background: transparent; border: 2px solid white; color: white; transition: 0.2s;}
        .btn:hover { color: var(--color-text-hover); border-color: var(--color-text-hover); }
        .btn-green { border-color: var(--color-text-hover); color: var(--color-text-hover); }
        .hidden { display: none !important; }
        
        .controls-panel { margin-bottom: 20px; border: 1px solid #333; padding: 20px; display: inline-block; background: rgba(0, 40, 0, 0.1); box-shadow: 0 0 10px rgba(0, 255, 0, 0.1); }
    </style>
</head>
<body>

    <audio id="battleMusic" loop>
        <source src="battle.mp3" type="audio/mpeg">
    </audio>

    <button class="back-btn btn" onclick="location.href='index.html'">◀ В МЕНЮ</button>
    <h2 id="status" style="color: #0f0; margin-bottom: 30px;">ПІДКЛЮЧЕННЯ...</h2>
    
    <div id="placement" class="hidden controls-panel">
        <p id="info" style="margin-bottom: 15px; color: #0f0;">ОПЕРАЦІЯ: РОЗСТАВКА</p>
        <button class="btn" onclick="toggleOrient()">ОРІЄНТАЦІЯ: <span id="ot">ГОР</span></button>
        <button class="btn btn-green" onclick="autoPlace()">АВТОРОЗСТАНОВКА</button>
        <button class="btn" onclick="resetPlacement()">СКИНУТИ</button>
        <button id="confirm-btn" class="btn hidden" onclick="confirmShips()" style="background: #004400; color: #0f0;">ПІДТВЕРДИТИ ФЛОТ</button>
    </div>

    <div id="combat-panel" class="hidden controls-panel" style="border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.2);">
        <p style="margin-bottom: 15px; color: #ff00ff;">АРСЕНАЛ</p>
        <button id="super-btn" class="btn" style="border-color: #ff00ff; color: #ff00ff;" onclick="toggleSuper()">СУПЕРУДАР (1)</button>
    </div>

    <div style="display:flex; justify-content:center; gap:60px;">
        <div><p style="color: #888;">МІЙ ФЛОТ</p><div id="my-board" class="board"></div></div>
        <div><p style="color: #888;">СЕКТОР ВОРОГА</p><div id="enemy-board" class="board"></div></div>
    </div>

    <script>
        // АУДІО СИСТЕМА
        const battleMusic = document.getElementById('battleMusic');
        let audioStarted = false;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        document.body.addEventListener('click', () => {
            if (!audioStarted) {
                audioCtx.resume();
                battleMusic.volume = 0.4;
                battleMusic.play().catch(e => console.log(e));
                audioStarted = true;
            }
        }, { once: true });

        function playClickSfx() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playHoverSfx() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function playExplosionSfx() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.3; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1000;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start();
        }

        function playSplashSfx() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        // Прив'язка звуків до кнопок
        setTimeout(() => {
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('mouseenter', playHoverSfx);
                btn.addEventListener('click', playClickSfx);
            });
        }, 500);

        const p = new URLSearchParams(window.location.search);
        let ws, phase, isTurn, fleet = [], curIdx = 0, isHor = true, grid = Array(10).fill().map(()=>Array(10).fill(0));
        const shipLengths = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
        let isSuperActive = false; let superUsed = false;

        function create(id, isE) {
            const b = document.getElementById(id);
            const letters = ['', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
            for(let i=0; i<11; i++) {
                const d = document.createElement('div'); d.className = 'coord-label'; d.innerText = letters[i]; b.appendChild(d);
            }
            for(let y=0; y<10; y++) {
                const num = document.createElement('div'); num.className = 'coord-label'; num.innerText = y + 1; b.appendChild(num);
                for(let x=0; x<10; x++) {
                    const c = document.createElement('div'); c.className='cell'; c.dataset.x = x; c.dataset.y = y;
                    c.onclick = () => isE ? shoot(x, y) : place(x, y);
                    c.onmouseenter = () => {
                        if(isE && isSuperActive && !superUsed && phase === 'playing') {
                            for(let dx=-1; dx<=1; dx++) {
                                for(let dy=-1; dy<=1; dy++) {
                                    let hc = document.querySelector(`#enemy-board .cell[data-x='${x+dx}'][data-y='${y+dy}']`);
                                    if(hc) hc.classList.add('super-hover');
                                }
                            }
                        }
                    };
                    c.onmouseleave = () => { document.querySelectorAll('#enemy-board .cell').forEach(cell => cell.classList.remove('super-hover')); };
                    b.appendChild(c);
                }
            }
        }
        create('my-board', 0); create('enemy-board', 1);

        function toggleOrient() { isHor = !isHor; document.getElementById('ot').innerText = isHor ? 'ГОР' : 'ВЕРТ'; }
        function resetPlacement() {
            curIdx = 0; fleet = []; grid = Array(10).fill().map(()=>Array(10).fill(0));
            document.querySelectorAll('#my-board .cell').forEach(c => c.className = 'cell');
            document.getElementById('confirm-btn').classList.add('hidden');
        }
        function checkValid(x, y, len, hor) {
            for (let i = 0; i < len; i++) {
                let cx = hor ? x + i : x, cy = hor ? y : y + i;
                if (cx >= 10 || cy >= 10) return false;
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        let nx = cx + dx, ny = cy + dy;
                        if (nx >= 0 && nx < 10 && ny >= 0 && ny < 10 && grid[ny][nx] === 1) return false;
                    }
                }
            }
            return true;
        }
        function place(x, y) {
            if(phase != 'placement' || curIdx >= 10) return;
            let len = shipLengths[curIdx];
            if (!checkValid(x, y, len, isHor)) return;
            playClickSfx(); // Звук встановлення
            fleet.push({x, y, length: len, is_horizontal: isHor});
            for(let i=0; i<len; i++) {
                let cx = isHor ? x+i : x, cy = isHor ? y : y+i;
                const cell = document.querySelector(`#my-board .cell[data-x='${cx}'][data-y='${cy}']`);
                if(len==1) cell.classList.add('ship-one');
                else {
                    if(i==0) cell.classList.add('ship-top');
                    else if(i==len-1) cell.classList.add('ship-bottom');
                    else cell.classList.add('ship-center');
                    if(isHor) cell.classList.add('horizontal');
                }
                grid[cy][cx] = 1;
            }
            curIdx++;
            if(curIdx == 10) document.getElementById('confirm-btn').classList.remove('hidden');
        }
        function autoPlace() {
            resetPlacement(); let attempts = 0;
            while(curIdx < 10 && attempts < 2000) { place(Math.floor(Math.random() * 10), Math.floor(Math.random() * 10), isHor = Math.random() > 0.5); attempts++; }
        }

        function confirmShips() { 
            ws.send(JSON.stringify({action:'place_ships', ships:fleet})); 
            document.getElementById('placement').classList.add('hidden'); 
        }

        function toggleSuper() {
            if (superUsed) return;
            isSuperActive = !isSuperActive;
            const btn = document.getElementById('super-btn');
            btn.style.background = isSuperActive ? '#ff00ff' : 'transparent';
            btn.style.color = isSuperActive ? '#000' : '#ff00ff';
        }

        function shoot(x, y) { 
            if(isTurn && phase == 'playing') {
                if (isSuperActive && !superUsed) {
                    ws.send(JSON.stringify({action:'super_shoot', x: x, y: y}));
                    superUsed = true; isSuperActive = false;
                    const btn = document.getElementById('super-btn');
                    btn.innerText = "СУПЕРУДАР (0)"; btn.style.background = "transparent"; btn.style.color = "#555"; btn.style.borderColor = "#555"; btn.style.cursor = "not-allowed";
                    document.querySelectorAll('#enemy-board .cell').forEach(cell => cell.classList.remove('super-hover'));
                } else {
                    ws.send(JSON.stringify({action:'shoot', x: x, y: y})); 
                }
            }
        }
        
        const wsUrl = `ws://${location.host}/ws/game/${p.get('room')}?mode=${p.get('mode')}&nickname=${p.get('nickname')}`;
        ws = new WebSocket(wsUrl);

        ws.onmessage = (e) => {
            const d = JSON.parse(e.data);
            if(d.type=='game_phase') { 
                phase=d.phase; 
                document.getElementById('status').innerText=d.message; 
                if(phase=='placement') document.getElementById('placement').classList.remove('hidden'); 
                if(phase=='playing') document.getElementById('combat-panel').classList.remove('hidden');
            }
            if(d.type=='turn') { 
                isTurn=d.is_your_turn; 
                document.getElementById('status').innerText=isTurn?'ТВІЙ ХІД! ВОГОНЬ!':'СУПРОТИВНИК ЦІЛИТЬСЯ...'; 
                document.getElementById('status').style.color = isTurn ? '#0f0' : '#888';
            }
            if(d.type=='shoot_result') {
                const b = d.is_mine?'my-board':'enemy-board';
                const c = document.querySelector(`#${b} .cell[data-x='${d.x}'][data-y='${d.y}']`);
                
                // ЗВУКИ ВЛУЧАНЬ ТА ПРОМАХІВ
                if(d.status=='Мимо') { 
                    playSplashSfx(); 
                    c.classList.add('miss'); 
                } 
                else if (d.status=='Влучив' || d.status=='Потоплений') { 
                    playExplosionSfx(); 
                    c.classList.add('hit'); 
                }
                
                if(d.auto_misses) d.auto_misses.forEach(([mx, my]) => {
                    const adjCell = document.querySelector(`#${b} .cell[data-x='${mx}'][data-y='${my}']`);
                    if(adjCell) adjCell.classList.add('miss');
                });
            }
            if(d.type=='game_over') { alert(d.message); location.href='index.html'; }
            if(d.type=='error') alert(d.message);
        };
    </script>
</body>
</html>
