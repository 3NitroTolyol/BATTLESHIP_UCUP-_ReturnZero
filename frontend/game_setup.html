<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Battleship.io - Підготовка</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --color-bg: #080808; --color-text: #ffffff; --color-text-hover: #00ff00; --font-main: 'Press Start 2P', cursive; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: var(--color-bg); color: var(--color-text); font-family: var(--font-main); display: flex; justify-content: center; align-items: center; }
        .crt::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 2; background-size: 100% 4px, 6px 100%; pointer-events: none; }
        .setup-container { position: relative; z-index: 10; background: rgba(0, 68, 0, 0.1); border: 4px double var(--color-text); padding: 40px; width: 500px; display: flex; flex-direction: column; gap: 30px; }
        h2 { font-size: 20px; text-align: center; color: var(--color-text-hover); }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        input { background: transparent; border: 2px solid var(--color-text); color: var(--color-text-hover); font-family: inherit; padding: 15px; outline: none; }
        .mode-selection { display: flex; gap: 10px; }
        .mode-btn { flex: 1; background: transparent; border: 2px solid var(--color-text); color: var(--color-text); font-family: inherit; padding: 10px; cursor: pointer; }
        .mode-btn.active { background: var(--color-text-hover); color: black; }
        .start-btn { background: var(--color-text-hover); color: black; border: none; padding: 20px; font-family: inherit; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body class="crt">
    <div class="setup-container">
        <h2>ПІДГОТОВКА</h2>
        <div class="input-group"><label>НІКНЕЙМ:</label><input type="text" id="nick" value="RECRUIT"></div>
        <div class="input-group"><label>СЕКТОР:</label><input type="text" id="room" value="DELTA-1"></div>
        <div class="mode-selection">
            <button id="pve" class="mode-btn active" onclick="setMode('pve')">VS BOT</button>
            <button id="pvp" class="mode-btn" onclick="setMode('pvp')">VS HUMAN</button>
        </div>
        <button class="start-btn" onclick="go()">У БІЙ!</button>
    </div>
    <script>
        let mode = 'pve';
        function setMode(m) { mode = m; document.getElementById('pve').className = m=='pve'?'mode-btn active':'mode-btn'; document.getElementById('pvp').className = m=='pvp'?'mode-btn active':'mode-btn'; }
        function go() { location.href = `game.html?room=${document.getElementById('room').value}&mode=${mode}&nickname=${document.getElementById('nick').value}`; }
    </script>
</body>
</html>
